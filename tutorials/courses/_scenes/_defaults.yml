# Defaults shared by the Student Information System tutorial scenes.
#
# Scenes start with `extends: "_defaults"`. Maps are merged deeply, so a scene
# only states what it changes; lists and scalars replace the inherited value,
# and `null` wins, so a scene can turn an inherited setting off.
#
# Only plain values belong here: `@references` inside this file would resolve
# relative to the scene that imports it.

# The project every scene's Solution Explorer is scanned from and the fixture
# builds (see _fixture.yml for how it is built).
projectFixture:
  template: serene
  package: Serene.Templates
  name: CourseTutorial
  directory: CourseTutorial.Web
  solution: "Solution 'CourseTutorial' (1 of 1 project)"
  project: CourseTutorial.Web
  # the fixture's own template arguments (_fixture.yml): no demo modules, so a
  # template snapshot and a chapter's project show the same tree
  args: ["-D", "false"]

stage:
  theme: vs-dark
  title: CourseTutorial - Microsoft Visual Studio
  solution: CourseTutorial.Web

# 1400x900 is the frame size every chapter is published at; `{id}` in the
# output paths becomes the scene id.
video:
  width: 1400
  height: 900
  fps: 24
  tail: 0.8

output:
  mp4: ../img/{id}.mp4
  webp: null
  poster: ../img/{id}-poster.png

# App steps show the mock browser; IDE-only scenes never open it.
chrome: browser
# The login page is chapter 00's job; later chapters sign in before frame one
# and land on the dashboard, then navigate to the page they are about.
login: false
signIn:
  returnUrl: /
  waitFor: ".s-sidebar-link-text"
