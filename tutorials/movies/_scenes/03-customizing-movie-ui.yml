# Storyboard for tutorials/movies/03-customizing-movie-ui.md
#
# Fixture:  pnpm media app-fixture --scenario ../web/Docs/tutorials/movies/_scenes/03-customizing-movie-ui.yml --stages
# Render + publish:  pnpm media --id 03-customizing-movie-ui --publish
#
# This is the first mixed clip: editor steps come from the wireframe stage, and
# each app step runs the application at that point in the chapter. `appStages`
# builds one app copy per checkpoint, so the app really reflects the edits.

id: 03-customizing-movie-ui
title: Customizing field captions, columns, editors and CSS
edits: "03"          # the fixture must be built with this profile
chrome: browser      # the app steps show a browser window
login: false         # already shown in 02b: sign in before the first frame

stage:
  theme: vs-dark
  title: MovieTutorial - Microsoft Visual Studio
  solution: MovieTutorial.Web

# the files come from the generated application itself, so the editor shows
# exactly the code that is running -- including this chapter's edits
files:
  MovieRow.cs:
    snippet: "MovieRow_03.cs"
    fixturePath: Modules/MovieDB/Movie/MovieRow.cs
  MovieColumns.cs:
    snippet: "MovieColumns_03.cs"
    fixturePath: Modules/MovieDB/Movie/MovieColumns.cs
  MovieForm.cs:
    snippet: "MovieForm_03.cs"
    fixturePath: Modules/MovieDB/Movie/MovieForm.cs
  MovieDialog.tsx:
    snippet: "MovieDialog_03.tsx"
    fixturePath: Modules/MovieDB/Movie/MovieDialog.tsx
  MovieDialog.css: { fixture: "Modules/MovieDB/Movie/MovieDialog.css" }

verify:
  MovieRow.cs: Modules/MovieDB/Movie/MovieRow.cs
  MovieColumns.cs: Modules/MovieDB/Movie/MovieColumns.cs
  MovieForm.cs: Modules/MovieDB/Movie/MovieForm.cs
  MovieDialog.tsx: Modules/MovieDB/Movie/MovieDialog.tsx

# The chapter's editor steps above are also its fixture edits; app-fixture
# applies them to the generated files. Only the new CSS file is fixture-only.
fixtureFiles:
  Modules/MovieDB/Movie/MovieDialog.css: |
    /* caption width for the movie form */
    .s-MovieDB-MovieDialog .caption {
        width: 150px;
    }

# Checkpoints for the app frames. Each id is built from the first N edits;
# the scene switches to that app copy when it runs the app.
appStages:
  - id: runtime
    edits: 1
  - id: columns
    edits: 2
  - id: form
    edits: 4
  - id: css
    edits: 5
  - id: final
    edits: 6

video:
  width: 1400
  height: 900
  fps: 24
  tail: 0.8
  posterAt: 30

output:
  mp4: ../img/03-customizing-movie-ui.mp4
  webp: null
  poster: ../img/03-customizing-movie-ui-poster.png

budgets:
  maxDuration: 56
  maxBytes: 3_500_000

steps:
  # 1. the entity decides the caption everywhere
  - open: MovieRow.cs
    spotlight: "node:MovieRow.cs"
    caption: "MovieRow is the entity sergen generated"
    hold: 1.0

  - highlight: ["28-28"]
    spotlight: "line:28"
    caption: "Change Runtime's DisplayText on the entity"
    hold: 0.5

  - edit:
      file: MovieRow.cs
      find: '[DisplayText("Runtime")]'
      replace: '[DisplayText("Runtime (mins)")]'
    editMs: 900
    highlight: ["28-28"]
    spotlight: "line:28"
    caption: "The field title now says it is in minutes"
    hold: 1.2

  - screen: app
    appStage: runtime
    goto: /MovieDB/Movie
    waitFor: "#GridDiv"
    spotlight: ".s-GridContainer, #GridDiv"
    scroll: { selector: "#GridDiv .slick-viewport", left: 10000 }
    caption: "Run the app: the grid shows Runtime (mins)"
    hold: 2.2

  # 2. the grid column can override it
  - open: MovieColumns.cs
    spotlight: "node:MovieColumns.cs"
    caption: "MovieColumns overrides just the grid column"
    hold: 1.0

  - edit:
      file: MovieColumns.cs
      find: '    public int? Runtime { get; set; }'
      replace: "    [DisplayText(\"Runtime in Minutes\"), Width(150), AlignRight]\n    public int? Runtime { get; set; }"
    editMs: 1000
    highlight: ["14-16"]
    spotlight: "line:14"
    caption: "Add a display name, a width and right alignment"
    hold: 1.2

  - screen: app
    appStage: columns
    goto: /MovieDB/Movie
    waitFor: "#GridDiv"
    spotlight: ".s-GridContainer, #GridDiv"
    scroll: { selector: "#GridDiv .slick-viewport", left: 10000 }
    caption: "The grid column is now Runtime in Minutes"
    hold: 2.0

  # 3. the form chooses the editor
  - open: MovieForm.cs
    spotlight: "node:MovieForm.cs"
    caption: "MovieForm chooses the editor for each field"
    hold: 1.0

  - edit:
      file: MovieForm.cs
      find: '    public string? Description { get; set; }'
      replace: "    [TextAreaEditor(Rows = 3)]\n    public string? Description { get; set; }"
    editMs: 850
    highlight: ["8-9"]
    spotlight: "line:8"
    caption: "Description becomes a three-row textarea"
    hold: 0.8

  - edit:
      file: MovieForm.cs
      find: '    public string? Storyline { get; set; }'
      replace: "    [TextAreaEditor(Rows = 8)]\n    public string? Storyline { get; set; }"
    editMs: 850
    highlight: ["10-11"]
    spotlight: "line:10"
    caption: "Storyline becomes an eight-row textarea"
    hold: 1.0

  - screen: app
    appStage: form
    goto: /MovieDB/Movie
    click: ".add-button"
    waitFor: ".s-MovieDialog"
    spotlight: ".s-MovieDialog"
    caption: "The dialog now has two textareas"
    hold: 2.2

  # 4. a dialog-scoped stylesheet
  - open: MovieDialog.css
    spotlight: "node:MovieDialog.css"
    caption: "Give the dialog its own stylesheet"
    hold: 1.0

  - open: MovieDialog.tsx
    edit:
      file: MovieDialog.tsx
      insertBefore: "import { MovieForm"
      text: |
        import "./MovieDialog.css";
    editMs: 700
    highlight: ["1-2"]
    spotlight: "line:2"
    caption: "Import the stylesheet next to the dialog"
    hold: 1.0

  - screen: app
    appStage: css
    goto: /MovieDB/Movie
    click: ".add-button"
    waitFor: ".s-MovieDialog"
    spotlight: ".s-MovieDialog"
    caption: "Labels are 150px wide, so the fields line up"
    hold: 2.2

  # 5. the page title
  - open: MovieRow.cs
    highlight: ["4-4"]
    spotlight: "line:4"
    caption: "The row's DisplayText also names the page"
    hold: 0.8

  - edit:
      file: MovieRow.cs
      find: '[DisplayText("Movie"), InstanceName("Movie")]'
      replace: '[DisplayText("Movies"), InstanceName("Movie")]'
    editMs: 750
    highlight: ["4-4"]
    spotlight: "line:4"
    caption: "Movie becomes Movies"
    hold: 0.8

  - screen: app
    appStage: final
    goto: /MovieDB/Movie
    waitFor: "#GridDiv"
    spotlight: ".s-GridContainer, #GridDiv"
    scroll: { selector: "#GridDiv .slick-viewport", left: 10000 }
    caption: "The page is Movies now, with every customization still in place"
    hold: 2.4
