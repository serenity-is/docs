# Storyboard for the "After Generating Code" part of
# tutorials/movies/02-generating-code-for-movie-table.md
#
# Preview:  pnpm media --id 02b-run-the-app --preview   (not supported yet)
# Render:   pnpm media --id 02b-run-the-app --publish
#
# Unlike the IDE scenes, this one records the *real* application built by
# `pnpm media app-fixture`: a Serene app on SQLite, with the Movie module
# generated by sergen. Steps are actions against the real UI, not state
# patches, and `pnpm media` starts/stops the app around the take.

id: 02b-run-the-app
title: Running the application and managing movies
target: app
chrome: browser

video:
  width: 1400
  height: 900
  fps: 24
  tail: 0.8
  posterAt: 26.5

output:
  mp4: ../img/02b-running-the-application.mp4
  webp: null
  poster: ../img/02b-running-the-application-poster.png

budgets:
  maxDuration: 42
  maxBytes: 3_000_000

steps:
  # the site redirects to the login page
  - goto: /MovieDB/Movie
    waitFor: "[name=Username]"
    spotlight: "[name=Username]"
    caption: "The site asks you to sign in"
    hold: 2.6

  - type: admin
    into: "[name=Username]"
    typeSpeed: 90
    spotlight: "[name=Username]"
    hold: 0.4

  - type: serenity
    into: "[name=Password]"
    typeSpeed: 70
    spotlight: "[name=Password]"
    caption: "The template creates an admin / serenity account"
    hold: 1.6

  - click: "[type=submit]"
    waitFor: "#GridDiv"
    spotlight: null
    caption: "Signing in lands on the generated Movie page"
    hold: 2.2

  # the generated module shows up in the navigation
  - goto: /
    waitFor: ".s-sidebar-link-text"
    spotlight: '.s-sidebar-link-text:text-is("MovieDB")'
    caption: "sergen added the MovieDB module to the navigation"
    hold: 1.6

  - click: '.s-sidebar-link-text:text-is("MovieDB")'
    caption: "Expand MovieDB"
    hold: 1.0

  - clickVisible: '.s-sidebar-link-text:text-is("Movie")'
    waitFor: "#GridDiv"
    spotlight: "#GridDiv"
    caption: "The Movie page lists the records in the table"
    hold: 1.8

  # add a movie
  - click: ".add-button"
    waitFor: ".s-MovieDialog"
    spotlight: null
    caption: "New Movie opens an empty form"
    hold: 1.2

  - type: The Matrix
    into: "[name=Title]"
    typeSpeed: 60
    spotlight: "[name=Title]"
    caption: "Title is the only required field"
    hold: 0.6

  - type: 1999
    into: "[name=Year]"
    typeSpeed: 70
    spotlight: "[name=Year]"
    hold: 0.4

  - type: 136
    into: "[name=Runtime]"
    typeSpeed: 70
    spotlight: "[name=Runtime]"
    caption: "Year and runtime are optional numbers"
    hold: 0.6

  - click: ".save-and-close-button"
    waitFor: ".slick-row"
    spotlight: null
    caption: "Save writes the record and returns to the grid"
    hold: 2.0

  # edit it
  - click: ".slick-row .slick-cell.l1 .s-EditLink"
    waitFor: ".s-MovieDialog"
    spotlight: null
    caption: "Clicking a record opens it for editing"
    hold: 1.4

  - type: "The Matrix (1999)"
    into: "[name=Title]"
    typeSpeed: 45
    spotlight: "[name=Title]"
    hold: 0.6

  - click: ".save-and-close-button"
    waitFor: ".slick-row"
    spotlight: null
    caption: "Saving again updates the same record"
    hold: 1.8

  # delete it
  - click: ".slick-row .slick-cell.l1 .s-EditLink"
    waitFor: ".s-MovieDialog"
    spotlight: null
    hold: 1.2

  - click: ".delete-button"
    waitFor: ".s-ConfirmDialog"
    spotlight: null
    caption: "Delete asks for confirmation"
    hold: 1.6

  # Serene confirms in its own dialog, not with the browser's confirm()
  - confirmYes: true
    waitGone: ".s-ConfirmDialog"
    spotlight: "#GridDiv"
    caption: "The grid is empty again"
    hold: 2.4
